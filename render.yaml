# Creates billable hosting and persistent storage. Review current pricing before applying.
services:
  - type: web
    name: tiktokcorewithrileigh
    runtime: node
    plan: starter
    branch: standalone-admin
    buildCommand: npm install --ignore-scripts && npm run build:standalone
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: tracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_STANDALONE
        value: 'true'
      - key: DATABASE_PATH
        value: /var/data/tracker.sqlite
      - key: ADMIN_PASSWORD
        sync: false
      - key: MEMBER_PASSWORD
        sync: false
      - key: RECORD_KEY_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
